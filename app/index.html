<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light only">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: capacitor: https://localhost; font-src 'self' data:; connect-src 'self' data: blob: capacitor: https://localhost; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>ZungiDill Web App | Fix credit report errors on iPhone</title>
<meta name="theme-color" content="#F4F5F7">

<meta property="og:url" content="https://zungidill.com/app/">
<meta property="og:image" content="https://zungidill.com/img/og.png">

<style>:root{color-scheme:light only}
:root{
  --bg:#f2f2f7;--card:#fff;--ink:#000;--ink2:#3c3c43;--muted:#8a8a8e;--line:rgba(60,60,67,.18);
  --fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);--field:#fff;
  --brand:#f7ce3e;--brand-ink:#161410;--pink:#e5467f;--green:#248a3d;--red:#d70015;--blue:#0a64d8;
  --soft:#fff8dc;--bar:rgba(249,249,249,.84);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  --r:12px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --nav:44px;--tab:50px;
}
@media (prefers-color-scheme:zd-never-dark){:root:not([data-theme=light]){
  --bg:#000;--card:#1c1c1e;--ink:#fff;--ink2:#ebebf5;--muted:#8d8d93;--line:rgba(84,84,88,.6);
  --fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.32);--field:#1c1c1e;--soft:#2b2512;--bar:rgba(22,22,24,.82);
  --green:#30d158;--red:#ff453a;--blue:#409cff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:var(--bg);touch-action:manipulation}
body{color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.35;letter-spacing:-.022em;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input,textarea,select,.sheet,.selectable{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;letter-spacing:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}

/* navigation bar */
.navbar{position:absolute;left:0;right:0;top:0;z-index:10;height:calc(var(--st) + var(--nav));padding-top:var(--st);
  display:flex;align-items:center;justify-content:center;padding-left:var(--sl);padding-right:var(--sr);background:transparent;transition:background .2s,box-shadow .2s}
.navbar.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--line)}
.navbar .ttl{font-weight:600;font-size:17px;opacity:0;transition:opacity .15s}
.navbar.solid .ttl{opacity:1}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior-x:none;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:calc(var(--st) + var(--nav)) calc(16px + var(--sr)) calc(var(--tab) + var(--sb) + 28px) calc(16px + var(--sl))}
.wrap{max-width:620px;margin:0 auto}
h1.large{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em;margin:2px 4px 10px}
.lede{color:var(--muted);font-size:15px;line-height:20px;margin:-4px 4px 16px}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  padding:0 var(--sr) var(--sb) var(--sl);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--line)}
.tabs button{all:unset;cursor:pointer;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.01em;position:relative;min-width:0;text-align:center}
@media (min-width:700px){.tabs{grid-template-columns:repeat(5,minmax(0,120px));justify-content:center}}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--ink)}
.tabs button[aria-current=page] svg{stroke-width:2.1}
.tabs button[aria-current=page] .dot{opacity:1}
.tabs .dot{position:absolute;top:5px;left:50%;margin-left:-19px;width:5px;height:5px;border-radius:50%;background:var(--brand);opacity:0}
.badge{position:absolute;top:3px;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:12px;line-height:18px;font-weight:600;text-align:center}

/* grouped lists */
.sect{font-size:13px;line-height:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:24px 16px 7px}
.foot{font-size:13px;line-height:18px;color:var(--muted);margin:7px 16px 0}
.group{background:var(--card);border-radius:var(--r);overflow:hidden;margin:0 0 4px}
.group>*+*{box-shadow:inset 16px .5px 0 var(--card),inset 0 .5px 0 var(--line)}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;width:100%;text-align:left;background:var(--card);border:0}
button.cell{cursor:pointer}
button.cell:active,.row:active{background:var(--fill)}
.cell .grow{flex:1;min-width:0}
.cell .val{color:var(--muted)}
.chev::after{content:"";flex:none;width:7px;height:7px;border-right:2px solid #c4c4c7;border-top:2px solid #c4c4c7;transform:rotate(45deg);margin-left:4px}
.row{display:block;width:100%;text-align:left;border:0;background:var(--card);padding:12px 36px 12px 16px;position:relative;cursor:pointer}
.row::after{content:"";position:absolute;right:18px;top:50%;width:7px;height:7px;border-right:2px solid #c4c4c7;border-top:2px solid #c4c4c7;transform:translateY(-50%) rotate(45deg)}
.row .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .nm{font-weight:600}
.row .amt{font-variant-numeric:tabular-nums;color:var(--ink2)}
.row .meta{font-size:15px;color:var(--muted);margin-top:2px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--fill);color:var(--ink2);letter-spacing:0}
.pill.y{background:var(--brand);color:var(--brand-ink)}
s.was{color:var(--muted);font-weight:500;margin-right:2px}
.checkup summary{list-style:none;cursor:pointer;display:flex;align-items:center;flex-wrap:wrap;font-size:17px}
.checkup summary::-webkit-details-marker{display:none}
.pill.r{background:rgba(229,70,127,.14);color:var(--pink)}
.pill.g{background:rgba(36,138,61,.13);color:var(--green)}

/* cards and text */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card h3{font-size:17px;font-weight:600;margin:0 0 4px}
.card p{margin:6px 0 0;color:var(--ink2);font-size:15px;line-height:20px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:15px;line-height:20px}
.fine{font-size:13px;line-height:18px;color:var(--muted)}
.note{background:var(--soft);border-radius:var(--r);padding:12px 14px;margin:12px 0;font-size:15px;line-height:20px;color:var(--ink2)}
.flag{display:block;background:rgba(229,70,127,.1);border-radius:10px;padding:10px 12px;margin:10px 0 0;font-size:15px;line-height:20px}
.err{background:rgba(215,0,21,.09);color:var(--red);border-radius:10px;padding:11px 13px;margin-top:12px;font-size:15px;font-weight:500}
.empty{background:var(--card);border-radius:var(--r);padding:34px 22px;text-align:center;margin-bottom:12px}
.empty .ic{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;background:var(--brand);display:flex;align-items:center;justify-content:center}
.empty .ic svg{width:30px;height:30px;stroke:var(--brand-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty b{display:block;font-size:20px;font-weight:600;margin-bottom:6px}
.empty span{display:block;color:var(--muted);font-size:15px;line-height:20px;max-width:30ch;margin:0 auto}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 18px;margin-top:12px;background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:17px;cursor:pointer;text-align:center;transition:transform .08s,opacity .12s}
.btn:active:not(:disabled){transform:scale(.98);opacity:.85}
.btn.alt{background:var(--fill);color:var(--ink)}
.btn.plain{background:none;color:var(--blue);font-weight:500;padding:10px}
.btn.dest{background:none;color:var(--red);font-weight:500}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:15px;border-radius:18px;margin-top:10px}
.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--fill);border-radius:9px;padding:2px;margin:0 0 14px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:6px 4px;font-size:13px;font-weight:500;border-radius:7px;letter-spacing:-.01em}
.seg button[aria-pressed=true]{background:var(--card);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme:zd-never-dark){:root:not([data-theme=light]) .seg button[aria-pressed=true]{background:#636366}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px 4px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;border-radius:16px;padding:7px 13px;font-size:15px;background:var(--card);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--card);font-weight:600}
.chips .lock{display:inline-block;width:10px;height:10px;margin-left:6px;vertical-align:-1px;opacity:.55}

/* forms */
label{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:18px 4px 6px}
label .hint{text-transform:none;letter-spacing:0}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=email],input[type=tel],input[type=password],select,textarea{
  width:100%;font:inherit;font-size:17px;letter-spacing:-.02em;color:var(--ink);background:var(--field);border:0;border-radius:10px;padding:11px 14px;min-height:44px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input.datepill{display:inline-flex;align-items:center;justify-content:flex-end;white-space:nowrap;gap:6px;width:auto;min-width:140px;min-height:34px;padding:6px 12px;background:var(--fill);text-align:right;border-radius:8px}
input.datepill::-webkit-date-and-time-value{text-align:right}
input[type=date].empty::before{content:attr(placeholder);color:var(--blue);font-weight:500}
input[type=date].empty::-webkit-datetime-edit{display:none}
textarea{min-height:110px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0}
.opt{display:flex;gap:12px;align-items:center;text-transform:none;letter-spacing:-.022em;color:var(--ink);font-size:17px;margin:0;background:var(--card);padding:12px 16px;cursor:pointer;min-height:44px}
.opts{border-radius:var(--r);overflow:hidden;margin-top:4px}
.opts .opt+.opt{box-shadow:inset 0 .5px 0 var(--line)}
.opt input{flex:none;width:22px;height:22px;margin:0;accent-color:#1c1c1e}
.switch{position:relative;flex:none;width:51px;height:31px}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:16px;background:var(--fill2);transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.switch input:checked+i{background:#34c759}
.switch input:checked+i::after{transform:translateX(20px)}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}

.stepn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;align-self:flex-start;margin-top:1px}
/* item detail */
dl.kv{margin:12px 0 0;background:var(--card);border-radius:var(--r);overflow:hidden}
dl.kv div{display:flex;justify-content:space-between;gap:16px;padding:11px 16px;font-size:17px}
dl.kv div+div{box-shadow:inset 16px .5px 0 var(--card),inset 0 .5px 0 var(--line)}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;text-align:right}

/* letters */
.paper{margin:0 0 12px}
.sheet{position:relative;background:#fff;color:#111;font-family:var(--serif);font-size:13px;line-height:1.55;letter-spacing:0;padding:34px 30px 30px;border-radius:4px;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 18px 40px -24px rgba(0,0,0,.45);overflow:hidden}
.sheet p{margin:0 0 .85em}
.sheet ol{padding-left:1.25em;margin:0 0 .85em}
.sheet li{margin-bottom:.7em}
.sheet .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1}
.sheet .wm span{transform:rotate(-28deg);font-family:var(--sans);font-weight:800;font-size:52px;line-height:1.05;letter-spacing:.06em;color:rgba(0,0,0,.1);text-align:center}
.printmark{font-family:var(--sans);font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-align:center;color:#444;border-bottom:1px solid #ccc;padding-bottom:6px;margin-bottom:14px}
.sheet.locked{max-height:300px}
.sheet.locked .ph{height:9px;border-radius:5px;background:#e9e9ec;margin:0 0 9px}
.sheet.locked .gap{height:10px}
.sheet.locked .fade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(rgba(255,255,255,0),#fff 75%)}
.pay{text-align:center;padding:22px 18px}
.pay .ic{width:48px;height:48px;margin:0 auto 10px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center}
.pay .ic svg{width:24px;height:24px;stroke:var(--brand-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pay h3{font-size:20px}
.pay .covers{text-align:left;margin:14px 0 4px;padding:0;list-style:none;font-size:15px}
.pay .covers li{padding:7px 0;box-shadow:inset 0 -.5px 0 var(--line);display:flex;justify-content:space-between;gap:10px}
.pay .covers li span{color:var(--muted)}

/* boost */
.bar{height:6px;border-radius:3px;background:var(--fill2);margin:0 4px 10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.plan .opt{font-size:16px}.plan .opt.done{color:var(--ink2)}.plan .opt .hint{margin-left:auto;font-size:12px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.04em}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 12px}
.stat{background:var(--card);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:28px;line-height:34px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* sheets */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.36);display:flex;align-items:flex-end;justify-content:center;animation:fadein .22s ease}
.pn{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - var(--st) - 10px);border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.pn-h{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:6px 8px 6px 16px;position:relative}
.pn-h::before{content:"";position:absolute;top:6px;left:50%;margin-left:-18px;width:36px;height:5px;border-radius:3px;background:var(--fill2)}
.pn-h b{font-size:17px;font-weight:600}
.pn-h .sp{min-width:64px}
.pn-x{border:0;background:none;color:var(--blue);font-size:17px;padding:10px 10px;cursor:pointer;min-width:64px;text-align:right}
.pn-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(24px + var(--sb))}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.still,.still .pn{animation:none}
.closing .pn{transform:translateY(100%);transition:transform .22s ease-in}.closing{opacity:0;transition:opacity .22s}
.iv-q{font-weight:700;font-size:22px;line-height:28px;margin:6px 4px 16px}
.iv-opts{display:grid;gap:10px}
.iv-opt{text-align:left;cursor:pointer;background:var(--card);border:0;border-radius:var(--r);padding:16px;font-size:17px;font-weight:500}
.iv-opt:active{background:var(--fill)}
.iv-draft{background:var(--card);border-radius:var(--r);padding:16px;font-size:17px;line-height:1.45;box-shadow:inset 3px 0 0 var(--brand)}
.steps{display:flex;gap:4px;margin:0 4px 14px}.steps i{flex:1;height:3px;border-radius:2px;background:var(--fill2)}.steps i.on{background:var(--ink)}

/* alerts */
.al{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;animation:fadein .15s}
.al-b{width:270px;border-radius:14px;background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);text-align:center;overflow:hidden}
.al-b .t{padding:19px 16px 0;font-weight:600;font-size:17px}
.al-b .m{padding:3px 16px 19px;font-size:13px;line-height:17px}
.al-b .a{display:flex;box-shadow:inset 0 .5px 0 var(--line)}
.al-b .a button{flex:1;border:0;background:none;padding:11px;font-size:17px;color:var(--blue);cursor:pointer}
.al-b .a button+button{box-shadow:inset .5px 0 0 var(--line);font-weight:600}
.al-b .a button.dest{color:var(--red)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sb) + 18px);transform:translate(-50%,10px);background:rgba(30,30,32,.94);color:#fff;padding:10px 16px;border-radius:20px;font-size:15px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:70;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* photos */
.pf-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.pf{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--fill)}
.pf img{width:100%;height:100%;object-fit:cover;display:block}
.pf-x{position:absolute;top:3px;right:3px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:24px;padding:0;cursor:pointer}

/* welcome */
.welcome{padding:calc(var(--st) + 28px) 24px calc(var(--sb) + 28px);overflow-y:auto;height:100%}
.welcome .logo{height:52px;margin:8px 0 26px}
.welcome h1{font-size:34px;line-height:40px;font-weight:700;letter-spacing:.01em;margin:0 0 10px}
.feat{display:flex;gap:14px;align-items:flex-start;margin:22px 0}
.feat .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:center}
.feat .ic svg{width:24px;height:24px;stroke:var(--brand-ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

}

  r.onerror=function(e){var c=e&&e.error;done();

/* ---------- output: PDF, copy ---------- */
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function sheetBlocks(){
  var el=$('sheet'),out=[];if(!el)return out;
  [].forEach.call(el.children,function(n){
    if(n.classList.contains('wm'))return;
    if(n.tagName==='P'||n.classList.contains('printmark')){
      var bold=n.querySelector('b')&&n.textContent.trim()===n.querySelector('b').textContent.trim();
      out.push({t:'p',bold:!!bold,lines:htmlLines(n),mark:n.classList.contains('printmark'),space:n.style.marginTop?18:0});
    }else if(n.tagName==='OL'){
      [].forEach.call(n.children,function(li,k){out.push({t:'li',n:k+1,lines:htmlLines(li)})});
    }
  });
  return out;
}
function htmlLines(n){var h=n.innerHTML.replace(/<br\s*\/?>/gi,'\n');var d=document.createElement('div');d.innerHTML=h;return d.textContent.split('\n').map(function(s){return s.replace(/\s+/g,' ').trim()})}

/* No app name on the file or inside the PDF: the letter is the person's own. */
function fileName(L){return (lname(L)+' letter').replace(/[^\w .-]+/g,'').replace(/\s+/g,' ').trim()+'.pdf'}
function makePDF(L){
  return (window.jspdf?Promise.resolve():loadScript('assets/vendor/jspdf.umd.min.js')).then(function(){
    var doc=new window.jspdf.jsPDF({unit:'pt',format:'letter'});
    try{var pn=S.demo?'':String(profile().name||'');doc.setProperties({title:lname(L),author:pn,creator:pn,subject:'',keywords:''})}catch(e){}
    var M=72,W=612-2*M,H=792,y=M,lh=15;
    doc.setFont('times','normal');doc.setFontSize(11.5);
    function need(h){if(y+h>H-M){doc.addPage();y=M}}
    sheetBlocks().forEach(function(b){
      if(b.mark){doc.setFont('helvetica','bold');doc.setFontSize(8);need(20);doc.text(b.lines.join(' ').toUpperCase(),306,y,{align:'center'});y+=22;doc.setFont('times','normal');doc.setFontSize(11.5);return}
      doc.setFont('times',b.bold?'bold':'normal');
      var ind=b.t==='li'?18:0;y+=b.space||0;
      b.lines.forEach(function(line,k){
        line=String(line).replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[\u2013\u2014]/g,'-');
        var parts=doc.splitTextToSize(line||' ',W-ind);
        parts.forEach(function(pt,j){need(lh);if(b.t==='li'&&k===0&&j===0)doc.text(b.n+'.',M,y);doc.text(pt,M+ind,y);y+=lh});
      });
      y+=b.t==='li'?5:9;
    });

  });

  return LN.getPending().then(function(p){

/* Steps for each goal. [title, body, action]. Action: ['act',name] | ['tab',name] | ['url',link,label] | ['boost',name,arg] */
function goalSteps(g){

  var build=['Start building, even while you dispute','A secured card or a credit builder loan from a credit union, paid on time every month, adds good history to your report. Disputes remove what is wrong; this adds what is right.',null];
  if(g==='car')return [mail,
    ['Get pre-approved before you shop','Ask a credit union or your bank for a car loan pre-approval. Walk in with that rate in hand. The dealer can try to beat it, and you are not stuck with theirs.',['url',CFG.creditUnions,'Find a credit union']],
    ['Ask if they report your payments','Many buy here pay here lots do not report on-time payments to the credit bureaus, so paying them every month may not build your credit. Ask: Do you report to Equifax, Experian and TransUnion? Get the answer in writing.',null],
    ['Compare the total, not the monthly payment','A longer loan lowers the payment but costs more overall. Look at the rate, the number of months and the total price before you sign.',null],
    build,
    ['Hold off on other applications','Every application can add a hard inquiry. When you shop for the car loan, do it within a short window, like 14 days. Scoring models usually count several auto loan checks close together as one.',null]];
  if(g==='home')return [mail,
    ['Every on-time payment from today counts','Mortgage lenders look closely at your recent history, especially the last 12 months. Set a reminder or autopay for every bill.',['boost','bill','new','Add a bill reminder']],
    ['Get your rent reported','Ask your landlord or property manager if they report rent to the credit bureaus. If not, rent reporting services can, some for a fee. On-time rent can help build your file.',null],
    ['Bring card balances down','Under 30% of each card limit, and under 10% is better. The tool below shows how much to pay.',null],
    ['Talk to a free housing counselor','HUD-approved housing counselors help with credit, budgets and down payment programs, often for free.',['url',CFG.housingCounselor,'Find a housing counselor']],
    build,
    ['No new credit before you apply','Hold off on new cards and loans in the months before a mortgage application.',null]];
  if(g==='card')return [mail,
    ['Start with a secured card','You put down a deposit, and that usually becomes your limit. Pick one that reports to all 3 bureaus. Many banks and credit unions offer one.',['url',CFG.creditUnions,'Find a credit union']],

function vProgress(){

  })});
  var fixed=ds.filter(function(i){return st[i.id]==='fixed'}).length,kept=ds.filter(function(i){return st[i.id]==='kept'}).length,open=ds.length-fixed-kept;

    var dd=due(L,rec);if(!nd||dd.date<nd.date)nd={date:dd.date,who:lname(L)};

      '<div class="cell"><span style="flex:none;margin-right:10px">Tracking no.</span><input type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Optional" aria-label="Tracking or confirmation number" data-trk="'+esc(L.id)+'" value="'+esc(t.tracking||'')+'" style="background:none;padding:0;min-height:0;border-radius:0;text-align:right;flex:1"></div>'+

    }else{

    }

    '<div class="stats"><div class="stat"><b>'+(c('Corrected')+c('Deleted')+c('Blocked'))+'</b>fixed</div><div class="stat"><b>'+c('Verified as accurate')+'</b>verified</div><div class="stat"><b>'+c('Waiting')+'</b>waiting</div></div>'+

}

/* what the person must do by hand before mailing; shown on the letter screen and before printing */

      L.type==='validate'?['Mail it certified with a return receipt','The receipt proves the date they got it. Send copies of any documents, never originals. Keep a copy of the letter, the receipt and the tracking number.']:['Mail it, and keep a copy','Regular mail is fine. If they say no, you can ask again in a few months, after more on-time payments.']

    return '<div class="group">'+st.map(function(s,k){return '<div class="cell" style="align-items:flex-start"><span class="stepn">'+(k+1)+'</span><span class="grow"><b style="font-weight:600">'+s[0]+'</b><br><span class="small" style="color:var(--ink2)">'+s[1]+'</span></span></div>'}).join('')+'</div>';
  }
  var steps=[
    L.type==='creditor'?['No Social Security number on this one','A company finds your account by its number. This letter has no place for your Social Security number, and you should not add it.']:
    ['Write in your date of birth and full Social Security number','On the two blank lines at the top of the printed letter, in pen. The bureau uses them to find your file. ZungiDill leaves them blank on purpose so they are never stored or sent anywhere.'],
    ['Sign it','Above your printed name at the bottom.'],
    ['Add one line in your own handwriting','Under your signature, write a short sentence in pen, in your own words, like \u201cPlease look into this. Thank you.\u201d It shows a real person sent it, not a service.'],
    L.type==='creditor'?['Fill in their address','If the address lines are blank, copy the dispute address from your report or the company\u2019s website.']:
      ['Circle each item on a copy of your report','Print the '+esc(L.who)+' report pages that show the '+(L.items.length===1?'item':'items')+', circle '+(L.items.length===1?'it':'each one')+', and put the copy in with the letter.'],
    ['Add copies of your ID and proof of address','A driver\u2019s license or state ID, and a recent utility bill or bank statement. Add any proof listed under Enclosed. Send copies, never originals.'],
    ['Mail it certified with a return receipt','At the post office, ask for Certified Mail with a return receipt. The post office tells you the cost. Keep the receipt with the tracking number and add it on the Track tab. The clock starts the day they receive it, which the tracking page or return receipt shows. Add that date too.'],
    ['No printer?','Public libraries, the UPS Store and office supply stores can print it for you. Save the PDF to your phone, then print it there.'+(L.type==='bureau'||L.type==='round2'?' Or dispute online instead, from this screen.':'')],
    ['Keep a copy of everything','A copy of the signed letter and everything you sent. You will need it if you dispute again or file a complaint.']
  ];
  return '<div class="group">'+steps.map(function(s,k){return '<div class="cell" style="align-items:flex-start"><span class="stepn">'+(k+1)+'</span><span class="grow"><b style="font-weight:600">'+s[0]+'</b><br><span class="small" style="color:var(--ink2)">'+s[1]+'</span></span></div>'}).join('')+'</div>';

/* ---------- item editing ---------- */
function openItem(id){
  var d=D().disputes[id];
  T.open=id;T.err='';T.itemScroll=0;T.itemAnim=false;
  T.draft=d?clone(d):{wrong:null,probs:[],balance:'',explain:'',toCred:false,facts:{}};
  if(!T.draft.facts)T.draft.facts={};
  render();
}
function closeItem(){
  var ov=document.querySelector('[data-ov=item]');
  var done=function(){T.open=null;T.draft=null;T.err='';render()};
  if(ov){ov.classList.add('closing');setTimeout(done,220)}else done();
}
function saveItem(){
  var d=T.draft,it=item(T.open),m='';
  if(d.wrong===null)m='Choose whether this item is correct.';
  else if(d.wrong){
    if(!d.probs.length)m='Check at least one thing that is wrong.';
    else if(d.probs.indexOf('balance')>-1&&!String(d.balance).trim())m='Enter the correct balance.';
    else if(String(d.explain).trim().length<20)m='Explain what is wrong in at least one full sentence. The 3 questions can write it for you.';
    else{var cf=conflict(it,d);if(cf&&cf.block)m=cf.text}
  }
  if(m){T.err=m;hap.warn();render();var e=document.querySelector('.err');if(e)e.scrollIntoView({block:'center',behavior:'smooth'});return}
  var added=applyDispute(it,d);
  hap.ok();closeItem();
  toast(added.length?'Also added to your '+added.join(' and ')+' letter':(d.wrong?'Added to your disputes':'Marked correct'));
}
/* Saves an answer for one item. A dispute is carried to the same account on another report when that report shows the same thing. */
function applyDispute(it,d){
  var b=D();
  if(!d.wrong){d.probs=[];d.toCred=false}
  b.disputes[it.id]=d;
  if(!d.wrong){Object.keys(b.results).forEach(function(k){if(k.split('|')[1]===it.id)delete b.results[k]});[b.mov,b.cfpb,b.stmt,b.notify,b.r2].forEach(function(o){delete o[it.id]})}
  var added=[];
  if(d.wrong&&it.acct&&it.kind!=='public'){
    items().forEach(function(t){
      if(t.bureau===it.bureau||t.name!==it.name||t.acct!==it.acct)return;
      /* only carry a dispute to another report when that report shows the same thing */
      var same=d.probs.every(function(k){return k==='notmine'||k==='duplicate'||(k==='balance'?t.balance===it.balance:(k==='late'?t.history===it.history:t.status===it.status&&t.balance===it.balance))});
      if(!same)return;
      var ex=b.disputes[t.id];if(ex&&(ex.wrong||ex.wrong===false))return;
      var c=clone(d);c.auto=true;b.disputes[t.id]=c;added.push(t.bureau);
    });
  }
  save();
  return added;
}
function removeItem(id){
  ask({title:'Remove this item?',message:'Anything you wrote about it is removed too.',ok:'Remove',destructive:true}).then(function(y){
    if(!y)return;var b=S.real;
    b.mine=b.mine.filter(function(x){return x.id!==id});
    delete b.disputes[id];[b.mov,b.stmt,b.notify,b.cfpb,b.r2,b.proofs,b.gw,b.val].forEach(function(o){if(o)delete o[id]});
    T.open=null;T.draft=null;render();toast('Removed');
  });
}

  }

/* ---------- three questions that write the explanation ---------- */
function opt(label,text,extra){return {label:label,text:text,extra:extra||null}}
function rep(it){
  var f={};
  f.who=it.name||'this company';
  f.ref=it.acct?(it.kind==='public'?(/^case\b/i.test(it.acct)?it.acct:'case '+it.acct):acctLong(it)):(it.kind==='public'?'this record':it.kind==='inquiry'?'this inquiry':'this account');
  f.Ref=cap(f.ref);f.bal=it.balance||'';f.balOf=f.bal?' with a balance of '+f.bal:'';
  f.open=it.opened?fd(pd(it.opened)):'';f.openOn=f.open?', opened '+f.open:'';
  f.stat=it.status||'';f.hist=it.history||'';f.bad=it.dateBad?monthYear(it.dateBad):'';
  var fb=it.dateBad&&!it.bk?firstBad(it):null;f.orig=fb?monthYear(fb.toISOString().slice(0,10)):f.bad;
  var lp=it.kind==='account'&&!isColl(it);f.law7=lp?'15 U.S.C. § 1681c(a)(5)':'15 U.S.C. § 1681c(a)(4)';f.what7=lp?'that late payment':'this item';
  return f;
}
function low(t){return t?t.charAt(0).toLowerCase()+t.slice(1):t}
function firstQ(it,d){
  var f=rep(it),p=d.probs[0]||'other',who=f.who;
  if(p==='notmine'&&it.kind==='public')return {k:'own',q:'Is this record yours?',o:[
    opt('It is not mine','The public record '+who+(it.acct?' ('+it.acct+')':'')+(f.bad?', dated '+f.bad+',':'')+' in my file is not mine. I was never a party to it.'),
    opt('It belongs to someone else with a similar name','The public record '+who+(it.acct?' ('+it.acct+')':'')+' in my file belongs to someone else. My information has been mixed with another person\u2019s.'),
    opt('Someone used my information','The public record '+who+(it.acct?' ('+it.acct+')':'')+' resulted from someone using my information without my permission.'),
    opt('I am not sure','I do not recognize the public record '+who+(it.acct?' ('+it.acct+')':'')+' in my file, and I am asking that it be verified.')]};
  if(p==='notmine')return {k:'own',q:'Have you ever had an account with '+who+'?',o:[
    opt('Never, not once','I have never held an account with '+who+'. The entry they report'+(it.acct||f.open||f.bal?', '+f.ref+f.openOn+f.balOf+',':'')+' is not mine, and I never authorized anyone to open an account in my name with this company.'),
    opt('I had one, but not this one','I have had an account with '+who+' in the past, but it is not '+f.ref+'. That entry'+(f.bal?', and the '+f.bal+' balance on it,':'')+' is not mine.'),
    opt('Someone used my information',f.Ref+', reported by '+who+(f.open?' and opened '+f.open:'')+', was opened using my information without my permission.'),
    opt('I am not sure','I do not recognize '+f.ref+' that '+who+' reports'+f.balOf+', and they have not shown me anything that proves it belongs to me.')]};
  if(p==='late')return {k:'late',q:'What actually happened with these payments?',o:[
    opt('I paid every one on time',who+' reports '+(f.hist?low(f.hist):'a late payment')+' on '+f.ref+'. That did not happen. I paid this account on time in that period and in every other month.'),
    opt('They have the wrong month',who+' reports '+(f.hist?low(f.hist):'a late payment')+' on '+f.ref+'. The timing is wrong. My payment records for that account do not show a missed payment then.'),
    opt('It was deferred or in hardship',f.Ref+' with '+who+' was in a deferment or hardship arrangement when they reported '+(f.hist?low(f.hist):'it late')+', so it should not carry a late mark for that period.'),
    opt('I caught it up long ago',f.Ref+' with '+who+' is current'+(f.bal?', showing a balance of '+f.bal:'')+', and the late mark they report'+(f.hist?' ('+low(f.hist)+')':'')+' is not accurate for that period.')]};
  if(p==='balance')return {k:'balance',q:'What is wrong with the balance?',o:[
    opt('It should be zero',who+' reports a balance of '+(f.bal||'an amount owed')+' on '+f.ref+'. That account is paid and the balance should be zero.'),
    opt('It is higher than I owe','The balance of '+(f.bal||'the amount')+' that '+who+' reports on '+f.ref+' is higher than what I actually owe.'),
    opt('Payments are missing','I have made payments on '+f.ref+' that are not reflected in the '+(f.bal||'balance')+' '+who+' reports.'),
    opt('I do not owe them at all','I do not owe '+who+' anything. The '+(f.bal||'balance')+' they report on '+f.ref+' should not appear in my file at all.')]};
  if(p==='paid')return {k:'paid',q:'When did you pay it?',o:[
    opt('In the last month','I paid '+f.ref+' with '+who+' within the last month. They still report it unpaid'+f.balOf+'.'),
    opt('A few months ago','I paid '+f.ref+' with '+who+' several months ago. They still report it unpaid'+f.balOf+'.'),
    opt('Over a year ago','I paid '+f.ref+' with '+who+' more than a year ago. They still report it unpaid'+f.balOf+'.'),
    opt('It was settled','I settled '+f.ref+' with '+who+'. It should not be reported as unpaid'+(f.bal?', and the '+f.bal+' balance they show is wrong':'')+'.')]};
  if(p==='saleBal'){var prop=isFc(it)?'home':'vehicle';return {k:'sale',q:'What happened after the '+prop+' was sold?',o:[
    opt('It still shows the full balance',who+' reports '+f.ref+(f.bal?' with a balance of '+f.bal:'')+'. The '+prop+' was sold, and the balance does not reflect what it sold for.'),
    opt('I was told I owe nothing after the sale','After the '+prop+' was sold, I was told I owe nothing more on '+f.ref+'. '+who+' still reports a balance'+(f.bal?' of '+f.bal:'')+'.'),
    opt('The amount left over is wrong','The balance '+who+' reports on '+f.ref+(f.bal?' ('+f.bal+')':'')+' is higher than what was left after the '+prop+' was sold.')]}}
  if(p==='shortsale')return {k:'fc',q:'How was it really resolved?',o:[
    opt('It was a short sale',f.Ref+' with '+who+' was resolved by a short sale, not a foreclosure. It should be reported that way.'),

    opt('It was modified, not foreclosed',f.Ref+' with '+who+' was resolved through a loan modification. No foreclosure was completed, so it should not be reported as one.')]};

    opt('More than 10 years ago',f.Ref+' with '+who+' dates'+(f.bad?' from '+f.bad:' back more than ten years')+' and is past the reporting period allowed in 15 U.S.C. § 1681c(a).')]};

   For people who do not want to fill in forms. Each item gets three big answers.
   ZungiDill picks the reason from what it already found on the report, writes the sentence,
   and the person can add their own words, by typing or by talking with the keyboard microphone. */
function autoProbs(it){
  var out=[];
  if(it.kind!=='account'&&it.kind!=='collection'&&it.kind!=='public')return out;
  if(pastRemoval(it)||outdatedInfo(it))out.push(['outdated',it.bk?2:0]);
  if(reagedInfo(it))out.push(['reaged',linked(it).length?2:0]);
  if(dupInfo(it))out.push(['duplicate',0]);
  return out;
}
var FILLER=/\b(um+|uh+|erm+|hmm+|you know|i mean|kinda|sorta|lol|smh)\b[,.]?\s*/gi;
var ROUGH=/\b(fuck\w*|shit\w*|damn\w*|bitch\w*|asshole\w*|bullshit|crap\w*|hell)\b/gi;
/* Cleans up what someone typed or said: no filler words, no cursing, capital I, full sentences. */
function tidyWords(t){
  var x=String(t||'').replace(/\s+/g,' ').trim(),rough=false;
  if(!x)return {text:'',rough:false};
  x=x.replace(ROUGH,function(){rough=true;return ''}).replace(FILLER,'');
  x=x.replace(/\bi\b/g,'I').replace(/\bim\b/gi,'I’m').replace(/\bdont\b/gi,'don’t').replace(/\bdidnt\b/gi,'didn’t').replace(/\bcant\b/gi,'can’t').replace(/\bwont\b/gi,'won’t').replace(/\bive\b/gi,'I’ve').replace(/\bthats\b/gi,'that’s').replace(/\bwasnt\b/gi,'wasn’t').replace(/\bisnt\b/gi,'isn’t').replace(/\bnever ever\b/gi,'never').replace(/\ba (account|address|apartment|amount|agreement)\b/gi,'an $1');
  x=x.replace(/\s+([,.!?])/g,'$1').replace(/([,.!?]){2,}/g,'$1').replace(/!+/g,'.').replace(/\s{2,}/g,' ').trim();
  x=x.replace(/(^|[.?]\s+)([a-z])/g,function(m,a,b){return a+b.toUpperCase()});
  if(x&&!/[.?]$/.test(x))x+='.';
  if(x.length>700)x=x.slice(0,700).replace(/\s+\S*$/,'')+'.';
  return {text:x,rough:rough};
}

var pdfLib=null;
function getPdf(){
  if(pdfLib)return Promise.resolve(pdfLib);
  return loadScript('assets/pdf/pdf.min.js').then(function(){
    pdfLib=window.pdfjsLib;pdfLib.GlobalWorkerOptions.workerSrc='assets/pdf/pdf.worker.min.js';return pdfLib;

function linesFrom(tc){
  var rows={};
  tc.items.forEach(function(it){
    if(!it.str||!it.str.trim())return;
    var y=Math.round(it.transform[5]),key=y;
    if(rows[key+1])key=key+1;else if(rows[key-1])key=key-1;
    (rows[key]=rows[key]||[]).push({x:it.transform[4],s:it.str});

    return rows[k].sort(function(a,b){return a.x-b.x}).map(function(o){return o.s}).join(' ').replace(/\s+/g,' ').trim();
  }).join('\n');
}
function pickFile(accept){
  return new Promise(function(res){
    var inp=document.createElement('input');inp.type='file';inp.accept=accept;inp.style.display='none';document.body.appendChild(inp);
    inp.addEventListener('change',function(){var f=inp.files&&inp.files[0];inp.remove();res(f||null)});
    inp.click();
  });
}

    return a[0].getDocument({data:new Uint8Array(a[1]),isEvalSupported:false,enableXfa:false}).promise /* isEvalSupported:false blocks CVE-2024-4367 */;
  }).then(function(pdf){
    var n=pdf.numPages,pages=[];
    var seq=Promise.resolve();
    for(var i=1;i<=n;i++)(function(i){seq=seq.then(function(){progress&&progress('Reading page '+i+' of '+n);return pdf.getPage(i).then(function(pg){return pg.getTextContent()}).then(function(tc){pages.push(linesFrom(tc))}).catch(function(){pages.push('')})})})(i);
    return seq.then(function(){
      var text=pages.join('\n');
      if(text.replace(/\s/g,'').length>=60)return {text:text,pages:n};
      var OCR=ocrPlug();
      if(!NATIVE||!OCR)return {text:text,pages:n,scanned:true};
      var out=[],s2=Promise.resolve();
      for(var j=1;j<=Math.min(n,12);j++)(function(j){s2=s2.then(function(){
        progress&&progress('Reading scanned page '+j+' of '+n);
        return pdf.getPage(j).then(function(pg){
          var vp=pg.getViewport({scale:2}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
          return pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise.then(function(){
            return OCR.detectText({base64:c.toDataURL('image/jpeg',.85)});
          }).then(function(r){out.push(ocrLines(r))});

      return s2.then(function(){return {text:out.join('\n'),pages:n,ocr:true}});

function ocrPlug(){return ANDROID?plug('ZDStore'):plug('CapacitorOcr')}
/* Apple Vision (and ML Kit on Android, converted to match) returns boxes with the origin at the bottom left. Rebuild reading order. */
function ocrLines(r){
  var d=(r&&r.textDetections||[]).filter(function(t){return t.text}).map(function(t){return {x:t.topLeft[0],y:(t.topLeft[1]+t.bottomLeft[1])/2,h:Math.abs(t.topLeft[1]-t.bottomLeft[1]),s:t.text}});

/* ---------- report import ---------- */
var HEADER=/^(collections?|accounts? in good standing|satisfactory accounts|adverse accounts|potentially negative items|closed accounts|open accounts|revolving accounts|installment accounts|mortgage accounts|inquiries|credit inquiries|regular inquiries|public records?|personal information|summary|accounts|account history|creditor contacts?)\s*:?\s*$/i;

var CHROME=/\b(credit (file|report)|prepared for|report date|file number|page \d|confidential|member number|date issued|personal credit report|reference number)\b/i;
var COLLECTION=/\bcollection|placed for collection|charge.?off|chargeoff|collection agency\b/i;

var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function pad(n){return (n<10?'0':'')+n}
function normDate(t){

function looksLikeName(l){
  if(!l)return false;var s=l.trim();
  if(s.length<3||s.length>64)return false;
  if(HEADER.test(s)||FIELD.test(s)||CHROME.test(s))return false;
  if(/^(equifax|experian|transunion|trans union)$/i.test(s))return false;
  if(s.indexOf(':')>-1&&s.indexOf(':')<24)return false;
  var letters=s.replace(/[^A-Za-z]/g,'');if(letters.length<3)return false;

var SUB={account:'Credit account',collection:'Collection',inquiry:'Inquiry',public:'Public record'};
function scan(text){
  var raw=text.split(/\r?\n/).map(function(l){return l.replace(/\s+/g,' ').trim()}).filter(function(l){return l.length});
  var section='',sections=[];
  raw.forEach(function(l){if(HEADER.test(l))section=l.replace(/[:\s]+$/,'').toLowerCase();sections.push(section)});
  var starts=[];for(var i=0;i<raw.length;i++)if(looksLikeName(raw[i]))starts.push(i);
  var out=[],seen={};
  for(var s=0;s<starts.length;s++){
    var from=starts[s],to=(s+1<starts.length)?starts[s+1]:Math.min(raw.length,from+14);
    if(to-from>18)to=from+18;
    for(var k=from+1;k<to;k++){if(HEADER.test(raw[k])){to=k;break}}
    var block=raw.slice(from,to),body=block.slice(1).join('\n'),whole=block.join('\n'),sec=sections[from]||'';
    var kind=/inquir/.test(sec)||/\binquiry\b/i.test(whole)?'inquiry':/public record/.test(sec)||PUBLIC.test(whole)?'public':/collection/.test(sec)||COLLECTION.test(whole)?'collection':'account';
    var name=cleanName(raw[from]);if(!name)continue;
    var acct=kind==='public'?((body.match(CASENO)||[])[1]||''):((body.match(ACCT)||[])[1]||'');
    var bal=((body.match(LABELLED_BAL)||[])[1]||(body.match(MONEY)||[])[0]||'').replace(/\s/g,'');
    var dRaw=((body.match(LABELLED_DATE)||[])[1]||(body.match(DATEPAT)||[])[0]||'');
    var stLine='';
    body.split('\n').some(function(l){
      var m=l.match(/(?:status|account status|payment status)\s*[:#]?\s*(.{2,40})/i);
      if(m){stLine=m[1].replace(/[.;]+$/,'').trim();return true}
      if(STATUS.test(l)&&l.length<44){stLine=l.replace(/^status\s*[:#]?\s*/i,'').trim();return true}
      return false;
    });
    var hist=((body.match(HIST)||[])[1]||'').trim();
    if(kind==='public'&&!stLine)block.some(function(l){if(PUBLIC.test(l)&&l.length<44&&!HEADER.test(l)){stLine=l.replace(/[.;]+$/,'').trim();return true}return false});
    if(kind==='inquiry'){if(!dRaw)continue}else if(!acct&&!bal&&!stLine&&!dRaw)continue;
    var key=(name+'|'+acct+'|'+kind).toLowerCase();if(seen[key])continue;seen[key]=1;
    out.push({pick:true,kind:kind,name:name,acct:(kind==='public'?acct.replace(/[^\w-]/g,''):acctFrom(acct)),
      balance:bal,opened:normDate(dRaw),rawDate:dRaw,status:stLine,history:hist,negative:NEG.test(whole),

  }

  raw.forEach(function(l){
    PERS_LINES.some(function(r){

      var v=m[1].replace(/\s+/g,' ').replace(/[.;]+$/,'').trim();if(v.length<3)return true;

/* Personal information worth checking: other names, other addresses, phone numbers, employers.
   The main name and current address are not added; they are the person's own. */
var PERS_LINES=[
  [/^(?:also reported as|also known as|aka|other names?|name variations?|names? reported|name variation)\s*[:#-]?\s*(.{3,60})$/i,'name'],
  [/^(?:previous|former|other|prior)\s+address(?:es)?\s*[:#-]?\s*(.{6,90})$/i,'address'],
  [/^(?:phone(?: numbers?)?|telephone(?: numbers?)?)\s*[:#-]?\s*(\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4})/i,'phone'],

var CSZ=/^(.+?),?\s+([A-Za-z]{2})\.?\s+(\d{5})(?:-\d{4})?$/;
function titleCase(x){return String(x).toLowerCase().replace(/(^|[\s\-'.])([a-z])/g,function(m,a,b){return a+b.toUpperCase()}).replace(/\b(Po|P\.o\.)\b/g,'PO').replace(/\b(Ne|Nw|Se|Sw)\b/g,function(m){return m.toUpperCase()})}
/* Own report only: the first report sets whose file this is. A report in another name is stopped, with no way to say "it's mine anyway". */
function nameParts(n){
  var w=String(n||'').toLowerCase().replace(/[^a-z\s'-]/g,' ').split(/\s+/).filter(function(x){return x&&x.length>1&&!/^(jr|sr|ii|iii|iv|v)$/.test(x)});
  return w.length>=2?{f:w[0],l:w[w.length-1]}:null;
}
function sameName(a,b){
  var x=nameParts(a),y=nameParts(b);if(!x||!y)return true;
  if(x.l!==y.l)return false;
  return x.f===y.f||(x.f.length>=3&&y.f.length>=3&&(x.f.indexOf(y.f)===0||y.f.indexOf(x.f)===0));
}
function ownerName(){return (S.owner&&S.owner.name)||String(S.profile.name||'').trim()}
function profileFrom(text){
  var raw=String(text||'').split(/\r?\n/).map(function(l){return l.replace(/\s+/g,' ').trim()}).filter(Boolean),out={};
  for(var i=0;i<raw.length&&i<400;i++){
    var l=raw[i],m;
    if(!out.name&&(m=l.match(/^(?:name|consumer name|your name|report (?:prepared )?for|prepared for|personal information for)\s*[:#-]\s*([A-Za-z][A-Za-z .,'-]{3,60})$/i))){
      var nm=m[1].replace(/[.,]+$/,'').trim();if(nm.split(/\s+/).length>=2&&!/\d/.test(nm))out.name=titleCase(nm);
    }
    if(!out.address&&(m=l.match(/^(?:current address|address|residential address|mailing address|current residence|addresses?)\s*[:#-]\s*(\d.{4,90})$/i))){
      var a=m[1].trim(),c;
      if(c=a.match(/^(.+?),\s*(.+?),?\s+([A-Za-z]{2})\.?\s+(\d{5})(?:-\d{4})?$/)){out.address=titleCase(c[1]);out.city=titleCase(c[2]);out.state=c[3].toUpperCase();out.zip=c[4]}
      else if(raw[i+1]&&(c=raw[i+1].match(CSZ))){out.address=titleCase(a.replace(/,$/,''));out.city=titleCase(c[1].replace(/,$/,''));out.state=c[2].toUpperCase();out.zip=c[3]}
    }
    if(out.name&&out.address)break;
  }
  return out;
}
/* keep the digits the report actually shows: 'XXXX4821' -> '4821', '51234567****' -> '5123XXXX' */
function acctFrom(a){
  a=String(a||'').replace(/[\u2022*#]/g,'X').replace(/[^0-9Xx]/g,'').toUpperCase();
  var d=a.replace(/X/g,'');if(!d)return '';
  if(/X$/.test(a))return d.slice(0,4)+'XXXX';
  return d.slice(-4);
}
function guessBureau(t){
  var s=String(t).toLowerCase(),c={Equifax:(s.match(/equifax/g)||[]).length,Experian:(s.match(/experian/g)||[]).length,TransUnion:(s.match(/trans\s?union/g)||[]).length};
  var best=BUREAUS.slice().sort(function(a,b){return c[b]-c[a]})[0];
  return c[best]?best:null;
}

/* ---------- reading the bureau's reply ----------
   Photos are read with Apple's on-device text recognition (Vision),
   PDFs with the same reader used for reports. Nothing leaves the phone.
   The app proposes a result for each item and the user confirms it. */
var R_PAT={
  del:/\b(DELETED|HAS BEEN REMOVED|WAS REMOVED|BEEN REMOVED|REMOVED FROM YOUR|NO LONGER (APPEARS|BE REPORTED|REPORTED|ON YOUR)|COULD NOT BE VERIFIED|UNABLE TO VERIFY|CANNOT BE VERIFIED|NOT BE VERIFIED)\b/,
  upd:/\b(UPDATED|MODIFIED|CORRECTED|HAS BEEN CHANGED|WAS CHANGED|BEEN CHANGED)\b/,
  ver:/\b(VERIFIED|REMAINS|NO CHANGE|ACCURATE AS REPORTED|REPORTED CORRECTLY|REPORTING CORRECTLY|BEING REPORTED ACCURATELY|MEETS FCRA|CONFIRMED)\b/,
  nblk:/\b(DECLINED TO BLOCK|NOT BE BLOCKED|UNABLE TO BLOCK|WILL NOT BLOCK|CANNOT BLOCK|NOT BLOCKED|DECLINE YOUR REQUEST TO BLOCK)\b/,
  blk:/\b(BLOCKED)\b/,
  ni:/\b(FRIVOLOUS|IRRELEVANT|WILL NOT BE INVESTIGAT\w*|WILL NOT INVESTIGAT\w*|NOT BE PROCESS\w*|UNABLE TO (PROCESS|LOCATE|IDENTIFY)\w*|NEED (ADDITIONAL|MORE) INFORMATION|REQUIRE (ADDITIONAL|MORE) INFORMATION|SUSPICIOUS|PREVIOUSLY (INVESTIGATED|VERIFIED|DISPUTED)|ALREADY (BEEN )?INVESTIGATED)\b/
};
var GENERIC=/^(BANK|BANKCARD|CARD|CREDIT|CREDITS|COLLECTION|COLLECTIONS|FINANCIAL|FINANCE|SERVICES|SERVICE|AUTO|LENDING|LOAN|LOANS|CAPITAL|NATIONAL|FIRST|GROUP|RECOVERY|ASSET|ASSETS|MANAGEMENT|SOLUTIONS|COMPANY|CORP|INC|LLC|THE|AND|MORTGAGE|FEDERAL|UNION|ACCOUNT|RECEIVABLES|PORTFOLIO|SYSTEMS|ASSOCIATES|AGENCY|ON|FILE|NAME|ADDRESS|EMPLOYER)$/;
function normU(t){return ' '+String(t||'').toUpperCase().replace(/[‘’']/g,'').replace(/[^A-Z0-9$]+/g,' ').replace(/\s+/g,' ')+' '}
function mentions(i,N){
  var pos=[],src=i.kind==='personal'?(i.status||''):i.name,n=normU(src).trim();
  function all(needle){if(!needle||needle.length<3)return;var k=N.indexOf(needle);while(k>-1){pos.push(k);k=N.indexOf(needle,k+1)}}
  if(n)all(' '+n+' ');
  if(!pos.length&&n){
    var words=n.split(' ').filter(function(w){return w.length>=4&&!GENERIC.test(w)&&!/^\d+$/.test(w)});
    words.sort(function(a,b){return b.length-a.length});
    if(words[0])all(' '+words[0]+' ');
    if(!pos.length&&i.kind==='personal'){var num=(src.match(/\d{2,}/)||[])[0];if(num)all(' '+num+' ')}
  }
  if(i.acct&&/^\d{4}$/.test(i.acct)&&i.kind!=='personal'){
    var re=new RegExp('(?:X{2,}|\\*{2,}|#{2,}|ENDING(?: IN)?|ACCOUNT|ACCT|NUMBER|NO) ?'+i.acct+'\\b','g'),m;
    while((m=re.exec(N)))pos.push(m.index);
  }
  return pos.sort(function(a,b){return a-b}).filter(function(p,k,a){return !k||p-a[k-1]>3});
}
function firstHit(win,keys){
  var best=null;
  keys.forEach(function(k){var m=R_PAT[k].exec(win);if(m&&(best===null||m.index<best.i))best={k:k,i:m.index,w:m[0]}});
  return best;
}
function analyzeReply(text,L){
  var N=normU(text),isBlk=L.type==='block',keys=isBlk?['nblk','blk','del']:['del','upd','ver'];
  var map={del:isBlk?'Blocked':'Deleted',upd:'Corrected',ver:'Verified as accurate',blk:'Blocked',nblk:'Not blocked'};
  var ment={};L.items.forEach(function(i){ment[i.id]=mentions(i,N)});
  var out={};
  L.items.forEach(function(i){
    var hit=null,snip='';
    ment[i.id].some(function(p){
      var end=Math.min(N.length,p+520);
      L.items.forEach(function(o){if(o.id===i.id)return;ment[o.id].forEach(function(q){if(q>p+6&&q<end)end=q})});
      var win=N.slice(p,end),h=firstHit(win,keys);
      if(h){hit=h;snip=win.slice(Math.max(0,h.i-60),h.i+h.w.length+40).trim();return true}
      return false;
    });
    out[i.id]={result:hit?map[hit.k]:null,found:ment[i.id].length>0,snip:snip};
  });
  var ni=R_PAT.ni.exec(N),anyRes=L.items.some(function(i){return out[i.id].result});
  if(!anyRes&&ni&&!isBlk)L.items.forEach(function(i){out[i.id].result='Not investigated';out[i.id].snip=N.slice(Math.max(0,ni.index-80),ni.index+60).trim()});
  if(!anyRes&&!ni&&L.items.length===1){
    var h=firstHit(N,keys);if(h){out[L.items[0].id].result=map[h.k];out[L.items[0].id].guess=true;out[L.items[0].id].snip=N.slice(Math.max(0,h.i-60),h.i+60).trim()}
  }
  return {items:out,bureau:guessBureau(text),notInvestigated:!!ni};
}
var VERB={'Deleted':'deleted','Corrected':'corrected','Verified as accurate':'verified','Not investigated':'refused to investigate','Blocked':'blocked','Not blocked':'declined to block','Reinserted after deletion':'put back','No answer by the deadline':'did not answer about'};
function summarize(L,res){
  var who=L.type==='creditor'?L.who:L.who,groups={},unknown=[];
  L.items.forEach(function(i){var r=res[i.id];var n=i.kind==='personal'?(i.status||i.name):i.name;if(!r||r==='Waiting')unknown.push(n);else(groups[r]=groups[r]||[]).push(n)});
  var parts=Object.keys(groups).map(function(r){return (VERB[r]||r.toLowerCase())+' '+listJoin(groups[r])});
  var s=parts.length?who+' '+listJoin(parts)+'.':'';
  if(unknown.length)s+=(s?' ':'')+'The letter does not clearly say what happened to '+listJoin(unknown)+'.';
  return s;
}

function openReply(letterId){
  var L=letters().find(function(x){return x.id===letterId});if(!L)return;
  var pages=[],text='',found=null,pick={};
  var s=sheet('Read their reply',{onClick:function(e){
    var b=e.target.closest('[data-rr]');if(!b)return;var a=b.getAttribute('data-rr');
    if(a==='cam')shoot();
    else if(a==='lib')library();
    else if(a==='pdf')pdf();
    else if(a==='paste'){s.body.querySelector('#rr_paste').hidden=false;b.hidden=true;var t=s.body.querySelector('#rr_text');if(t)t.focus()}
    else if(a==='text'){var t2=s.body.querySelector('#rr_text');read(t2?t2.value:'','text')}
    else if(a==='more')shoot();
    else if(a==='go')readPages();
    else if(a==='del'){pages.splice(+b.getAttribute('data-k'),1);pages.length?showPages():start()}
    else if(a==='ok')confirm();
    else if(a==='next'){s.close();goNext(b.getAttribute('data-next'),b.getAttribute('data-item'),b.getAttribute('data-bu'))}

/* Saves a bureau's answer for one item. The date of a deletion is kept, so a later report can show if it came back. */
function setResult(key,val){
  var b=D();b.results[key]=val;b.delAt=b.delAt||{};
  if(/Deleted|Blocked/.test(val)){if(!b.delAt[key])b.delAt[key]=new Date().toISOString().slice(0,10)}
  else if(val!=='Reinserted after deletion')delete b.delAt[key];
}
/* The deletion on file for an item, if any: {key, date} */
function deletedFor(id){
  var b=D(),hit=null;
  Object.keys(b.results).forEach(function(k){if(k.split('|')[1]===id&&/Deleted|Blocked/.test(b.results[k]))hit={key:k,date:(b.delAt||{})[k]||''}});
  return hit;
}
/* Items that were deleted and showed up again on a newer report. */
function cameBack(ids){
  var its=ids.map(item).filter(Boolean);if(!its.length)return;
  var s=sheet('These came back',{close:'Later',onClick:function(e,api){
    var b=e.target.closest('[data-cb]');if(!b)return;

      var x=D();
      its.forEach(function(i){var del=deletedFor(i.id);if(del)setResult(del.key,'Reinserted after deletion');
        x.back[i.id]={at:new Date().toISOString().slice(0,10),deleted:del?del.date:''};
        x.r2[i.id]={whatsNew:'reinserted',mov:'skip',proof:'reply'};x.cfpb[i.id]=true});
      api.close();T.letter='R-'+its[0].bureau;S.tab='letters';hap.ok();setTimeout(function(){render();toast('Letters written. They are free.')},240);

    '<div class="card" style="margin-top:12px"><h3>What the law says</h3><p>A deleted item can come back only if the company that reported it certifies it is complete and accurate. The bureau must tell you in writing within 5 business days, with that company\u2019s name and address (15 U.S.C. \u00a7 1681i(a)(5)(B)). Most people never get that letter.</p>'+

function num(x){var n=parseFloat(String(x==null?'':x).replace(/[^0-9.]/g,''));return isNaN(n)?0:n}
function money(n){return '$'+Math.ceil(n).toLocaleString('en-US')}
function ordinal(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function extLink(url,label,cls){return '<a class="btn '+(cls||'alt')+'" href="'+esc(url)+'" target="_blank" rel="noopener" style="text-decoration:none">'+label+'</a>'}
function cards(){return (S.bills||[]).filter(function(x){return x.kind==='card'&&num(x.lim)>0})}
function usage(){
  var cs=cards(),bal=0,lim=0;cs.forEach(function(c){bal+=num(c.bal);lim+=num(c.lim)});
  return {n:cs.length,bal:bal,lim:lim,pct:lim?bal/lim*100:0,
    to30:cs.reduce(function(a,c){return a+Math.max(0,num(c.bal)-.3*num(c.lim))},0),
    to10:cs.reduce(function(a,c){return a+Math.max(0,num(c.bal)-.1*num(c.lim))},0)};
}

  fallbackCopy(t,done);
}

      step(1,'Report it to the FTC','Go to IdentityTheft.gov and file a report. Save or print your Identity Theft Report. You will enclose a copy.')+
      step(2,'Place a free fraud alert','Contact one bureau and it tells the other two. A credit freeze stops new accounts entirely. Both are free.')+
      step(3,'Mark the accounts that are not yours','On your report, open each one, choose No, something is wrong, then It is not mine. Answer Yes, at IdentityTheft.gov.')+
      step(4,'Print and mail the block letter','ZungiDill writes one block letter for each bureau, with your FTC report listed as an enclosure.')+
    '</div>'+
    extLink('https://www.identitytheft.gov/','Open IdentityTheft.gov','')+
    '<p class="fine" style="margin:12px 4px 0">Fraud alert: '+BUREAUS.map(function(w){return '<a href="'+esc(CFG.fraudAlert[w])+'" target="_blank" rel="noopener" style="color:var(--blue)">'+w+'</a>'}).join(', ')+'. Freeze: '+BUREAUS.map(function(w){return '<a href="'+esc(CFG.freeze[w])+'" target="_blank" rel="noopener" style="color:var(--blue)">'+w+'</a>'}).join(', ')+'.</p>'+
    (ds.length?'<div class="sect">Already filed? Turn these into block letters</div><div class="group">'+ds.map(function(i){var blk=isBlock(i);return blk?'<div class="cell"><span class="grow">'+esc(i.name)+' <span class="muted small">'+esc(i.bureau)+'</span></span><span class="pill r">Block letter</span></div>':'<button class="cell chev" data-itm="'+i.id+'"><span class="grow">'+esc(i.name)+' <span class="muted small">'+esc(i.bureau)+'</span></span><span class="val">Mark as identity theft</span></button>'}).join('')+'</div>':'')+
    '<p class="foot">Only for real identity theft. Filing a false identity theft report is a federal crime. A block does not apply to accounts you opened yourself.</p>';
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('ov')&&t.getAttribute('data-ov')==='item'){closeItem();return}
  var b=t.closest('button,[data-demo]');if(!b||b.disabled)return;
  var ds=b.dataset;
  if(ds.tab){if(S.tab!==ds.tab)hap.pick();S.tab=ds.tab;T.open=null;render();($('scroll')||{}).scrollTop=0;return}
  if(ds.bureau){hap.pick();S.bureau=ds.bureau;render();return}
  if(ds.open){hap.tap();openItem(ds.open);return}
  if(ds.path){hap.tap();pathAct(ds.path);return}
  if(ds.ck){var ck=item(ds.ck);if(ck){hap.tap();S.bureau=ck.bureau;render();openItem(ds.ck)}return}
  if(ds.letter){hap.pick();T.letter=ds.letter;T.scrollY.letters=0;render();return}
  if(ds.next){goNext(ds.next,ds.item,ds.bu);return}
  if(ds.gw){openGoodwill(ds.gw);return}
  if(ds.val){openValidate(ds.val);return}
  if(ds.online){disputeOnline(ds.online);return}
  if(ds.boost){boostAct(ds.boost,ds.arg);return}
  if(ds.goal){hap.pick();S.goal=ds.goal;if(S.screen==='setup'){S.setupStep=1}render();if(S.screen==='app')toast('Plan set: '+GOALS[ds.goal].short);return}
  if(ds.pay){if(ds.pay==='sub'){buy('sub');return}if(ds.pay==='letterCredit'){buy('letterCredit');return}var L=letters().find(function(l){return l.id===T.letter});if(L)buy(ds.pay,L);return}
  if(ds.reply){openReply(ds.reply);return}
  if(ds.resedit){T.resEdit=T.resEdit||{};T.resEdit[ds.resedit]=!T.resEdit[ds.resedit];hap.pick();render();return}
  if(ds.replyDel){var rp=ds.replyDel.split('|');ask({title:'Remove this page?',ok:'Remove',destructive:true}).then(function(y){if(y){(D().replies[rp[0]]||[]).splice(+rp[1],1);render()}});return}
  if(ds.proofAdd){addProof(ds.proofAdd);return}
  if(ds.proofDel){var pp=ds.proofDel.split('|');(D().proofs[pp[0]]||[]).splice(+pp[1],1);render();return}
  if(ds.removeItem){removeItem(ds.removeItem);return}
  if(ds.addOpen){if(S.screen!=='app'){S.screen='app';S.tab='report';render()}openAdd();return}
  if(ds.importOpen){if(S.screen!=='app'){S.screen='app';S.tab='report';render()}openImport();return}
  if(ds.demo){
    S.demo=ds.demo==='on';T.open=null;T.draft=null;T.letter=null;S.tab='report';S.bureau='Equifax';
    if(S.screen!=='app')S.screen='app';
    render();($('scroll')||{}).scrollTop=0;toast(S.demo?'Showing the example report':'Back to your own report');return;
  }
  var a=ds.act;if(!a)return;
  if(a==='enter'){S.plansSeen=true;if(S.goal&&(items().length||profileReady())){S.screen='app';S.tab='home'}else{S.screen='setup';S.setupStep=S.goal?1:0}hap.ok();render()}
  else if(a==='setupNext'){hap.tap();if(S.setupStep>=1){S.screen='app';S.tab='home'}else S.setupStep++;render()}
  else if(a==='quick'){hap.tap();openQuick()}
  else if(a==='quickRepo'){hap.tap();openQuick(isRepoFc)}
  else if(a==='importGo'){hap.tap();openImport()}
  else if(a==='setupBack'){hap.tap();S.setupStep=Math.max(0,S.setupStep-1);render()}
  else if(a==='setupSkip'){hap.tap();S.screen='app';S.tab='home';render()}
  else if(a==='plans'){S.screen='plans';hap.tap();render()}
  else if(a==='plansDone'){S.plansSeen=true;S.screen='app';S.tab=lockedLetters().length?'letters':'report';hap.ok();render()}
  else if(a==='close')closeItem();
  else if(a==='saveItem')saveItem();
  else if(a==='compose')openCompose();
  else if(a==='restore')restorePurchases();
  else if(a==='manageSub')manageSub();
  else if(a==='redeem')openRedeem();
  else if(a==='pdf'){var L1=letters().find(function(l){return l.id===T.letter});if(L1)beforeMail(L1,function(){savePDF(L1)})}
  else if(a==='copy'){var L2=letters().find(function(l){return l.id===T.letter});if(L2)copyLetter(L2)}
  else if(a==='profileDone'){
    if(!profileReady()){hap.warn();tell('A few details are missing','Your name, street, city, state and ZIP code are all printed on the letter.');return}
    hap.ok();render();
  }
  else if(a==='erase'){
    ask({title:'Erase everything?',message:'Your items, disputes, letters, dates, photos and unlocked letters are removed from this '+DEV+'. This cannot be undone.',ok:'Erase',destructive:true}).then(function(y){
      if(!y)return;
      S.real=bucket();S.ex=bucket();S.bills=[];S.plan={};S.path={};S.freeRemind=false;S.unlock={};S.reportNo={};S.sub={active:false,expires:0};S.profile={name:'',address:'',city:'',state:'',zip:''};S.owner=null;S.demo=false;S.tab='report';
      T.open=null;T.draft=null;T.letter=null;syncReminders();render();toast('Everything erased');
    });
  }
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.type==='date')e.target.classList.toggle('empty',!e.target.value);
  var t=e.target,d=T.draft,ds=t.dataset||{};
  if(t.id==='agree'){S.agreed=t.checked;render();return}
  if(d&&ds.wrong){hap.pick();d.wrong=ds.wrong==='yes';T.err='';render();return}
  if(d&&ds.prob){hap.pick();var k=ds.prob;if(t.checked){if(d.probs.indexOf(k)<0)d.probs.push(k)}else d.probs=d.probs.filter(function(x){return x!==k});render();return}
  if(d&&ds.d==='toCred'){d.toCred=t.checked;render();return}
  if(d&&ds.f){d.facts[ds.f]=t.value;render();return}
  if(ds.iob){var xi=item(ds.iob);if(xi){D().ob=D().ob||{};if(t.value)D().ob[xi.id]=t.value;else delete D().ob[xi.id];save();render()}return}
  if(ds.ibad){var xb=item(ds.ibad);if(xb){xb.dateBad=t.value;if(t.value)xb.negative=true;save();render()}return}
  if(ds.iorig){var xo=item(ds.iorig);if(xo){var ov=String(t.value||'').trim().slice(0,60);xo.sub=ov?'Collection for '+ov:'Collection';save();render()}return}
  if(ds.recv){(D().track[ds.recv]=D().track[ds.recv]||{}).received=t.value;render();syncReminders(true);return}
  if(ds.trk){(D().track[ds.trk]=D().track[ds.trk]||{}).tracking=String(t.value||'').trim().slice(0,40);render();return}
  if(ds.annual){(D().track[ds.annual]=D().track[ds.annual]||{}).annual=t.checked;render();syncReminders();return}
  if(ds.res){hap.pick();setResult(ds.res,t.value);render();if(/Corrected|Deleted|Blocked/.test(t.value)){hap.ok();toast('That one is fixed. Nice work.')}return}
  if(ds.remind){S.reminders=t.checked;save();syncReminders(true);toast(t.checked?'Reminders on':'Reminders off');return}
  if(ds.billrem){S.billRemind=t.checked;save();syncReminders(true);toast(t.checked?'Bill reminders on':'Bill reminders off');return}
  if(ds.micshow){S.micOff=!t.checked;save();toast(t.checked?'Talk button on':'Talk button hidden');return}
  if(ds.freerem){S.freeRemind=t.checked;save();syncReminders(true);render();toast(t.checked?'Monthly reminder on':'Monthly reminder off');return}
  if(ds.plan){S.plan[ds.plan]=t.checked;hap.pick();render();return}
  if(ds.p==='name'&&S.owner&&!sameName(t.value,S.owner.name)){S.profile.name=S.owner.name;t.value=S.owner.name;save();hap.warn();tell('Use the name on your report','ZungiDill is only for your own credit report, and your letters must match it. Your report is in the name '+S.owner.name+'.');return}
  if(ds.p){S.profile[ds.p]=ds.p==='state'?t.value.toUpperCase():t.value;save();return}
});
document.addEventListener('input',function(e){
  var t=e.target,d=T.draft,ds=t.dataset||{};
  if(d&&ds.d&&ds.d!=='toCred'){d[ds.d]=t.value;return}
  if(d&&ds.cred){var it=item(T.open);if(it&&it.mine){it.cred=it.cred||{};it.cred[ds.cred]=t.value;save()}return}
  if(ds.p){S.profile[ds.p]=t.value;save();return}
  if(ds.rn){S.reportNo[ds.rn]=t.value;save();return}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&T.open)closeItem()});

/* ---------- start ---------- */
function boot(){
  load().then(function(){
    if(S.screen==='plans')S.screen=S.agreed?'app':'welcome';
    if(S.screen!=='app'&&S.screen!=='setup')S.screen='welcome';
    else if(S.screen==='app'){S.tab='home';T.open=null;T.letter=null}  /* 1.8: no paywall at launch. Letters are built first, payment comes at the letter. */
    render();loadPrices();syncReminders();checkSub();if(WEB)webReturn();
    document.addEventListener('visibilitychange',function(){if(!document.hidden)checkSub()});
    var SB=plug('StatusBar');
    if(NATIVE&&SB){
      var dark=null; /* ZungiDill always uses its light look */
      var setSB=function(){SB.setStyle({style:dark&&dark.matches?'DARK':'LIGHT'}).catch(function(){})};
      setSB();if(dark&&dark.addEventListener)dark.addEventListener('change',setSB);
    }
    var LN=plug('LocalNotifications');
    if(NATIVE&&LN&&LN.addListener)LN.addListener('localNotificationActionPerformed',function(a){var x=a&&a.notification&&a.notification.extra;if(S.screen!=='app')return;S.tab=(x&&x.tab)||'track';T.open=null;render()});
    var App=plug('App');
    if(NATIVE&&App&&App.addListener)App.addListener('backButton',function(){
      /* Android back: close the top sheet, then an open item, then leave the app */
      var ov=document.querySelectorAll('.ov:not(.closing)');
      if(ov.length){var x=ov[ov.length-1].querySelector('[data-x]');if(x)x.click();return}
      if(document.querySelector('.al'))return;
      if(T.open){closeItem();return}
      if(App.minimizeApp)App.minimizeApp().catch(function(){});else if(App.exitApp)App.exitApp();
    });
  });
}
window.ZD={S:S,T:T,render:render,letters:letters,analyzeReply:analyzeReply,summarize:summarize,scan:scan,ocrLines:ocrLines,isUnlocked:isUnlocked,PRICE:PRICE};
boot();
})();
</script>
